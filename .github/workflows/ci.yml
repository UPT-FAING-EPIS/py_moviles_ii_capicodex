name: CI Flutter

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gameon_mobile

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.9"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar módulos modificados
        run: >
          flutter analyze --no-pub
          lib/core/validation/coordenadas.dart
          lib/features/home/views/institucion_detail_view.dart
          lib/features/home/viewmodels/institucion_detail_viewmodel.dart
          lib/features/home/views/home_view.dart
          lib/features/home/views/mapa_instituciones_view.dart
          lib/features/perfil/services/auth_form_validators.dart
          lib/features/perfil/services/password_recovery_service.dart
          lib/features/perfil/views/password_recovery_view.dart
          lib/features/perfil/views/perfil_view/unauthenticated/forms/login_form.dart
          lib/core/config/backend_config.dart
          lib/features/perfil/viewmodels/perfil_viewmodel.dart
          lib/features/perfil/views/login_page/login_page.dart
          lib/features/perfil/views/login_page/widgets/custom_password_field.dart
          lib/features/perfil/views/perfil_view/authenticated/perfil_authenticated_view.dart
          lib/features/perfil/views/perfil_view/unauthenticated/forms/signup_form.dart
          lib/features/perfil/views/perfil_view/unauthenticated/forms/widgets/password_field.dart
          lib/features/perfil/models/usuario_deportista.dart
          lib/features/perfil/viewmodels/edit_perfil_viewmodel.dart
          lib/features/perfil/views/perfil_view/authenticated/edit_perfil/edit_perfil_view.dart
          lib/features/perfil/views/perfil_view/authenticated/edit_perfil/widgets/deportes_selector_card.dart
          lib/features/perfil/views/perfil_view/authenticated/edit_perfil/widgets/deportes_selector_sheet.dart
          lib/features/home/models/institucion_deportiva.dart
          lib/features/home/viewmodels/home_viewmodel.dart
          lib/features/gestor/services/gestor_service.dart
          lib/features/gestor/views/gestor_view.dart
          lib/features/reservas/models/calificacion_instalacion.dart
          lib/features/reservas/services/calificacion_service.dart
          lib/features/reservas/views/calificar_instalacion_sheet.dart
          lib/features/reservas/views/reservas_list/reserva_detail_view.dart
          test/features/home/ruta_instalacion_test.dart
          test/features/perfil/auth_form_validators_test.dart
          test/features/perfil/password_recovery_service_test.dart
          test/features/perfil/password_recovery_view_test.dart
          test/features/perfil/deportes_preferidos_test.dart
          test/features/gestor/registro_instalacion_test.dart
          test/features/gestor/consultar_reservas_test.dart
          test/features/reservas/calificacion_instalacion_test.dart

      - name: Ejecutar pruebas de la aplicación
        run: flutter test --no-pub --coverage --reporter expanded

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-flutter
          path: gameon_mobile/coverage/lcov.info
          if-no-files-found: ignore
