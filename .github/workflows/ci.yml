name: CI Taller 02

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Formato Taller 02
        run: dart format --output=none --set-exit-if-changed lib/features/home test/features/home

      - name: Análisis estático Taller 02
        run: flutter analyze lib/features/home test/features/home

      - name: Pruebas ViewModel
        run: flutter test test/features/home/viewmodels/home_viewmodel_test.dart

      - name: Compilar APK debug
        run: flutter build apk --debug
