name: CI Taller 02

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar secretos
        run: docker run --rm -v "$PWD":/src aquasec/trivy:latest fs --scanners secret --secret-config /src/trivy-secret.yaml --exit-code 1 /src

      - name: Análisis estático Taller 02
        run: >
          flutter analyze
          lib/features/home/domain
          lib/features/home/data
          lib/features/home/presentation
          lib/features/home/viewmodels/home_viewmodel.dart
          test/features/home/viewmodels/home_viewmodel_test.dart

      - name: Pruebas ViewModel
        run: flutter test test/features/home/viewmodels/home_viewmodel_test.dart

      - name: Pruebas de validación de registro e inicio de sesión
        run: flutter test --coverage --reporter expanded test/features/perfil/auth_form_validators_test.dart

      - name: Guardar cobertura de autenticación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-autenticacion
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Compilar APK debug
        run: flutter build apk --debug --android-skip-build-dependency-validation
